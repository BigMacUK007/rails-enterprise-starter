# Release evidence for the generated application.
#
# Generates a software bill of materials (SBOM) from the released source tree,
# including the resolved Gemfile.lock, and attaches it to the GitHub release.
#
# Evidence retention: keep the SBOM, the release tag, the commit SHA and the CI
# test run for that SHA together as the evidence pack for this release
# identifier. Workflow artifacts expire (90 days by default) — the SBOM attached
# to the release itself does not, so the release page is the durable evidence
# record. Link the green CI run for the released commit in the release notes.
name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write # required to attach the SBOM to the release
  checks: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - name: Checkout release ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve and verify required CI checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_sha}/check-runs" --paginate)"
          for required in lint security_static migrations test; do
            conclusion="$(jq -r --arg name "$required" '.check_runs[] | select(.name == $name) | .conclusion' <<<"$checks" | tail -1)"
            test "$conclusion" = success || { echo "Required check $required is $conclusion"; exit 1; }
          done
          echo "RELEASE_SHA=${release_sha}" >> "$GITHUB_ENV"

      # SPDX SBOM generated from the checked-out source, including the resolved
      # Gemfile.lock. The action uploads the SBOM as a workflow artifact and,
      # because this workflow runs on a release event, also attaches it to the
      # release as a downloadable asset.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@fbfd9c6c189226748411491745178e0c2017392d # v0.20.10
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-release-assets: true

      - name: Record release evidence pointers
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_AUTHOR: ${{ github.event.release.author.login }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "commit_sha=${RELEASE_SHA}"
            echo "release_author=${RELEASE_AUTHOR}"
            echo "release_url=${RELEASE_URL}"
            echo "approval_gate=production-release environment"
            echo "required_checks=lint,security_static,migrations,test"
            echo "evidence_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "ci_test_runs=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/ci.yml"
          } > release-evidence.txt
          cat release-evidence.txt

      - name: Attach evidence to immutable release record
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-evidence.txt --clobber

      - name: Retain release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: release-evidence.txt
