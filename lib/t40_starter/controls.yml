# T40 Enterprise Application Starter — control catalogue.
#
# Consumed by lib/t40_starter/control_manifest.rb, which merges this
# catalogue with the install manifest's module selections and writes
# config/t40/control-manifest.yml into the generated application.
#
# install_status:
#   enabled     — installed and active in the core baseline
#   deferred    — needs a project decision; owner_default is assigned
#   conditional — active only when `module` is selected in the manifest
#
# reference paths are relative to the generated application root, except
# modules/... which live in the starter repository.
#
# This catalogue supports evidence gathering; it does not by itself provide
# ISO 27001, SOC 2, Cyber Essentials, WCAG conformance or legal compliance.
controls:
  # --- authentication -------------------------------------------------------
  - id: AUTH-01
    name: "Sign-in codes are short-lived, single-use and generated from a cryptographically secure source"
    category: authentication
    install_status: enabled
    evidence_checks: [rspec]
    reference: docs/architecture/decisions/0002-passwordless-authentication.md
  - id: AUTH-02
    name: "Authentication responses resist account enumeration and timing disclosure"
    category: authentication
    install_status: enabled
    evidence_checks: [rspec]
    reference: docs/architecture/decisions/0002-passwordless-authentication.md
  - id: AUTH-03
    name: "Rate limits cover sign-in request and code verification paths"
    category: authentication
    install_status: enabled
    evidence_checks: [rspec]
    reference: docs/architecture/decisions/0002-passwordless-authentication.md

