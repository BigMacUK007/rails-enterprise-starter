# Starter CI — the rails-enterprise-starter repository's own pipeline.
#
# Security note: jobs run on `pull_request` and `push` events only, so runs
# triggered from forks receive a read-only GITHUB_TOKEN and no secrets. Never
# add a `pull_request_target` trigger combined with a checkout of the PR head.
name: Starter CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  installer-tests:
    name: Installer unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # pinned 2026-07-17
        with:
          ruby-version: "3.4"

      - name: Run installer unit tests
        run: ruby -Ilib -Itest test/all.rb

  acceptance:
    name: Acceptance (fresh generated application)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev postgresql-client

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # pinned 2026-07-17
        with:
          ruby-version: "3.4"

      - name: Install Rails
        run: gem install rails --version "~> 8.1"

      - name: Run acceptance harness
        run: ruby bin/acceptance

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acceptance-evidence
          path: tmp/acceptance/evidence.json
          if-no-files-found: warn
